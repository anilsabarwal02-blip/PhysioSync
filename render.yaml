# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: physiosync
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build && cd server && npm install --omit=dev
    startCommand: cd server && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false  # You must set this manually in the Render dashboard
      - key: PORT
        value: 5000
